<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | Empire Restaurant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- 1. Background & Animation (Same as Login) --- */
        body {
            background: radial-gradient(circle at top right, #1a2a6c, #112240, #0a192f);
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            overflow-y: auto; overflow-x: hidden;
            padding: 40px 20px;
            color: white;
        }

        .bg-particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden; z-index: -1;
        }
        .particle {
            position: absolute; width: 8px; height: 8px;
            background: rgba(0, 210, 211, 0.4);
            border-radius: 50%;
            animation: floatUp 12s infinite linear;
        }
        @keyframes floatUp { 
            0% { transform: translateY(100vh) scale(0); opacity: 0; } 
            50% { opacity: 1; } 
            100% { transform: translateY(-10vh) scale(2); opacity: 0; } 
        }

        /* --- 2. Glass Card --- */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            margin: auto;
        }

        /* --- 3. Role Icons --- */
        .role-grid {
            display: flex; justify-content: space-between; margin-bottom: 25px;
            background: rgba(0,0,0,0.3); padding: 10px; border-radius: 50px;
        }
        .role-btn {
            width: 45px; height: 45px; border-radius: 50%; border: none;
            background: transparent; color: rgba(255,255,255,0.5);
            font-size: 1.1rem; transition: 0.3s;
        }
        .role-btn:hover { color: white; background: rgba(255,255,255,0.1); }
        
        .role-btn.active { transform: scale(1.15); color: white; }
        .role-btn[data-role="Shop"].active { background: #00d2d3; box-shadow: 0 0 15px #00d2d3; color: black;}
        .role-btn[data-role="Worker"].active { background: #54a0ff; box-shadow: 0 0 15px #54a0ff; }
        .role-btn[data-role="Cook"].active { background: #ff9f43; box-shadow: 0 0 15px #ff9f43; color: black; }
        .role-btn[data-role="Cleaner"].active { background: #1dd1a1; box-shadow: 0 0 15px #1dd1a1; color: black; }

        .role-label { text-align: center; font-weight: bold; letter-spacing: 1px; margin-bottom: 20px; height: 20px; }

        .form-control {
            background: rgba(0,0,0,0.35) !important;
            border: 1.5px solid rgba(0,210,211,0.3) !important;
            color: white !important;
            border-radius: 10px;
            padding: 10px 15px;
        }
        .form-control:focus { border-color: #00d2d3 !important; box-shadow: 0 0 0 3px rgba(0,210,211,0.2) !important; }
        .form-control::placeholder { color: rgba(255,255,255,0.4); }
        .input-group-text { background: rgba(0,210,211,0.15); border: 1.5px solid rgba(0,210,211,0.3); border-right: none; color: #00d2d3; border-radius: 10px 0 0 10px; }
        .input-group .form-control { border-left: none !important; border-radius: 0 10px 10px 0 !important; }

        /* --- 5. Button --- */
        .btn-register {
            width: 100%; padding: 12px; border-radius: 30px; font-weight: bold; border: none;
            color: white; background: linear-gradient(90deg, #00d2d3, #54a0ff);
            transition: 0.3s; margin-top: 10px;
        }
        .btn-register:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,210,211,0.3); }

        /* File Upload Tweaks */
        input[type="file"]::file-selector-button {
            background: #00d2d3 !important; 
            color: #0a192f !important; 
            font-weight: bold;
            border: none; 
            padding: 8px 14px; 
            border-radius: 8px; 
            margin-right: 10px;
            cursor: pointer;
            transition: 0.3s;
        }
        input[type="file"]::file-selector-button:hover {
            background: #54a0ff !important;
            color: white !important;
        }
    </style>
</head>
<body>
<%- include('partials/loader.html') %>

    <div class="bg-particles">
        <div class="particle" style="left: 10%; animation-duration: 7s;"></div>
        <div class="particle" style="left: 50%; animation-duration: 11s;"></div>
        <div class="particle" style="left: 80%; animation-duration: 6s;"></div>
    </div>

    <div class="glass-card">
        <div style="text-align: center; margin-bottom: 20px;">
            <img src="/uploads/sg+logo.jpg" style="width: 70px; height: 70px; border-radius: 50%; object-fit: cover; background: white; padding: 2px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);" alt="Logo">
        </div>
        <h3 class="text-center text-white mb-2 fw-light">JOIN <b class="fw-bold text-info">THE TEAM</b></h3>
        <p class="text-white-50 text-center small mb-4">Submit your registration securely</p>

        <form id="regForm">
            <input type="hidden" name="role" id="selected_role" value="Worker">

            <!-- Shop ID Field -->
            <div class="mb-3">
                <label class="small text-white-50 mb-1 ps-1"><i class="fas fa-building me-1"></i> Shop ID <span class="text-danger">*</span></label>
                <div class="input-group mb-0">
                    <span class="input-group-text"><i class="fas fa-hashtag"></i></span>
                <input name="shop_id" class="form-control text-uppercase" placeholder="Enter Shop ID"
                       style="text-transform:uppercase" required autocomplete="off">
                </div>
            </div>

            <div class="role-grid">

                <button type="button" class="role-btn active" data-role="Worker" data-color="#54a0ff" onclick="setRole(this)">
                    <i class="fas fa-user-tie"></i>
                </button>
                <button type="button" class="role-btn" data-role="Cook" data-color="#ff9f43" onclick="setRole(this)">
                    <i class="fas fa-fire"></i>
                </button>
                <button type="button" class="role-btn" data-role="Cleaner" data-color="#1dd1a1" onclick="setRole(this)">
                    <i class="fas fa-broom"></i>
                </button>
            </div>
            <div id="role-text" class="role-label" style="color: #54a0ff;">WAITER / WORKER</div>

            <div class="row g-2">
                <div class="col-md-6">
                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="fas fa-id-card"></i></span>
                        <input name="fullname" class="form-control" placeholder="Full Name" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="fas fa-phone"></i></span>
                        <input name="mobile" class="form-control" placeholder="Mobile No">
                    </div>
                </div>
                <div class="col-md-12">
                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                        <input name="email" type="email" class="form-control" placeholder="Email Address">
                    </div>
                </div>
                <div class="col-md-12">
                    <div class="input-group mb-3">
                        <span class="input-group-text"><i class="fas fa-map-marker-alt"></i></span>
                        <input name="address" class="form-control" placeholder="Location / Address">
                    </div>
                </div>
            </div>

            <div class="input-group mb-3">
                <span class="input-group-text"><i class="fas fa-user"></i></span>
                <input name="username" class="form-control" placeholder="Create Username" required autocomplete="username">
            </div>

            <div class="input-group mb-3">
                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                <input name="password" id="reg-pwd" type="password" class="form-control" placeholder="Create Password" required autocomplete="new-password">
            </div>
            
            <div class="input-group mb-3">
                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                <input id="reg-pwd-confirm" type="password" class="form-control" placeholder="Confirm Password" required autocomplete="new-password">
            </div>
            
            <div class="mb-4">
                <label class="small text-white-50 mb-1 ps-1"><i class="fas fa-image me-1"></i> Profile Picture (Optional)</label>
                <input type="file" name="profile_pic" class="form-control form-control-sm text-secondary" accept="image/*">
            </div>

            <button type="submit" id="submit-btn" class="btn-register">
                SUBMIT REQUEST
            </button>

            <div class="text-center mt-4">
                <a href="/login" class="text-white-50 text-decoration-none small">
                    <i class="fas fa-sign-in-alt"></i> Already have an account? Login
                </a>
            </div>
        </form>
    </div>

    <script>
        // 1. Role Selection Logic
        function setRole(btn) {
            document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const role = btn.getAttribute('data-role');
            const color = btn.getAttribute('data-color');

            document.getElementById('selected_role').value = role;
            
            const label = document.getElementById('role-text');
            label.innerText = role === 'Shop' ? 'SHOP MANAGER' : role.toUpperCase();
            label.style.color = color;

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.style.background = `linear-gradient(90deg, ${color}, #222)`;
        }

        // 2. Form Submission (Using API)
        document.getElementById('regForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const pwd = document.getElementById('reg-pwd').value;
            const confirmPwd = document.getElementById('reg-pwd-confirm').value;
            
            if (pwd !== confirmPwd) {
                showToast('error', "Passwords do not match!");
                return;
            }
            
            const btn = document.getElementById('submit-btn');
            const originalText = btn.innerHTML;
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> UPLOADING...';
            btn.disabled = true;

            const formData = new FormData(this);

            try {
                const response = await fetch('/api/register', { method: 'POST', body: formData });
                const data = await response.json();
                
                if (data.success) {
                    showAlert('success', 'Registration Successful', "Please ask your Shop Manager to approve your account.");
                    setTimeout(() => window.location.href = '/login', 2500);
                } else {
                    showAlert('error', 'Registration Failed', data.message);
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                showAlert('error', 'Connection Error', "Please try again later.");
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });
    </script>

</body>
</html>
