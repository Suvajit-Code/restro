<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Display System | Empire OS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #2c3e50;
            color: white;
            font-family: 'Segoe UI', sans-serif;
        }

        .att-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
        }

        .card {
            border: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: 0.3s;
        }

        .card-header {
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-action {
            width: 100%;
            font-weight: bold;
            padding: 12px;
            border-radius: 0 0 5px 5px;
        }

        .border-processing {
            border-top: 5px solid #0dcaf0;
        }

        .border-cooking {
            border-top: 5px solid #ffc107;
        }

        .cooking-pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 193, 7, 0.7);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(255, 193, 7, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 193, 7, 0);
            }
        }

        /* Mobile remark section stacking */
        @media (max-width: 767px) {
            .att-remark-row {
                flex-direction: column;
                gap: 10px;
            }

            .att-remark-row>div {
                width: 100% !important;
            }
        }
    </style>
</head>

<body>
    <%- include('partials/loader.html') %>

        <nav class="navbar navbar-dark bg-dark px-3 px-md-4 shadow">
            <span class="navbar-brand d-flex align-items-center gap-2">
                <img src="/static/uploads/sg+logo.jpg"
                    style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover; background: white; padding: 1px;"
                    alt="Logo">
                KITCHEN
            </span>
            <div class="d-flex align-items-center gap-2 gap-md-3">
                <% if (session.role==='Admin' ) { %>
                    <a href="/admin" class="btn btn-sm btn-warning rounded-pill fw-bold text-dark"><i
                            class="fas fa-arrow-left me-1"></i> Back to Admin</a>
                    <% } else if (session.role==='Shop' ) { %>
                        <a href="/shop" class="btn btn-sm btn-warning rounded-pill fw-bold text-dark"><i
                                class="fas fa-arrow-left me-1"></i> Back to Shop</a>
                        <% } %>
                            <div class="d-flex align-items-center gap-2" style="cursor: pointer;" data-bs-toggle="modal"
                                data-bs-target="#myProfileModal">
                                <img src="/static/uploads/<%= session.profile_pic || 'default.jpg' %>"
                                    style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid white;">
                                <span class="text-white-50 d-none d-md-block fw-bold">
                                    <%= session.name %>
                                </span>
                            </div>
                            <span class="badge bg-secondary" id="clock">00:00:00</span>
                            <a href="/logout" class="btn btn-sm btn-outline-danger">Logout</a>
            </div>
        </nav>

        <div class="container-fluid mt-3 mt-md-4 px-3">

            <!-- Attendance Remark Card -->
            <div class="card att-card p-3 mb-4 text-white">
                <div class="row align-items-center att-remark-row g-2">
                    <div class="col-md-3">
                        <h6 class="mb-0"><i class="fas fa-user-clock me-2"></i> Chef Attendance</h6>
                    </div>
                    <div class="col-md-7">
                        <input type="text" id="attRemark" class="form-control bg-dark text-white border-secondary"
                            placeholder="Enter Shift Remark (e.g. Station 1, Lunch Break)">
                    </div>
                    <div class="col-md-2">
                        <button onclick="updateAttendance()" class="btn btn-primary w-100">
                            <i class="fas fa-save me-1"></i> Update
                        </button>
                    </div>
                </div>
            </div>

            <!-- Kitchen Board -->
            <div class="row" id="kitchen-board">
                <div class="col-12 text-center mt-5 text-white-50">
                    <h3><i class="fas fa-spinner fa-spin"></i> Connecting to Kitchen Feed...</h3>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/socket.io/socket.io.js"></script>
        <script>
            // 1. Clock
            setInterval(() => {
                document.getElementById('clock').innerText = new Date().toLocaleTimeString();
            }, 1000);

            // 2. Load Orders
            function loadOrders() {
                fetch('/api/cook/orders')
                    .then(r => r.json())
                    .then(data => {
                        const board = document.getElementById('kitchen-board');
                        if (data.length === 0) {
                            board.innerHTML = `
                        <div class="col-12 text-center mt-5 text-white-50">
                            <h1><i class="fas fa-utensils"></i></h1>
                            <h3>No Active Orders</h3>
                            <p>Waiting for orders from Shop Manager...</p>
                        </div>`;
                            return;
                        }
                        board.innerHTML = data.map(o => {
                            let itemsHtml = '(no items)';
                            try {
                                itemsHtml = JSON.parse(o.items).map(i =>
                                    `<li class="list-group-item bg-transparent text-white border-secondary d-flex justify-content-between py-1">
                                        <span>${i.n || i.name || '?'}</span>
                                        <span class="badge bg-secondary">×${i.q || i.qty || 1}</span>
                                    </li>`
                                ).join('');
                            } catch (e) { }

                            let cardClass = '', statusBadge = '', actionButton = '';

                            if (o.status === 'Processing' || o.status === 'New') {
                                cardClass = 'border-processing';
                                statusBadge = '<span class="badge bg-info text-dark px-3 py-2">NEW TICKET</span>';
                                actionButton = `<button onclick="updateStatus('${o.id}', 'Cooking')" class="btn btn-warning btn-action">
                                    <i class="fas fa-fire me-1"></i> START COOKING</button>`;
                            } else if (o.status === 'Cooking') {
                                cardClass = 'border-cooking cooking-pulse';
                                statusBadge = '<span class="badge bg-warning text-dark px-3 py-2"><i class="fas fa-fire me-1"></i> COOKING...</span>';
                                actionButton = `<button onclick="updateStatus('${o.id}', 'Ready')" class="btn btn-success btn-action">
                                    <i class="fas fa-check-circle me-1"></i> MARK AS READY</button>`;
                            }

                            return `
                    <div class="col-xl-3 col-lg-4 col-md-6 mb-4">
                        <div class="card bg-dark text-white ${cardClass} h-100">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h5 class="m-0">Table ${o.table_number}</h5>
                                <small class="text-white-50">#${o.id.substring(0,6)}</small>
                            </div>
                            <div class="card-body">
                                <div class="mb-3">${statusBadge}</div>
                                <ul class="list-group list-group-flush mb-3">${itemsHtml}</ul>
                                <div class="small text-secondary"><i class="fas fa-store me-1"></i>${o.shop_id || 'No Shop'}</div>
                            </div>
                            ${actionButton}
                        </div>
                    </div>`;
                        }).join('');
                    })
                    .catch(err => {
                        document.getElementById('kitchen-board').innerHTML = '<div class="col-12 text-center text-white-50 mt-5"><h4>Error loading orders.</h4></div>';
                    });
            }

            // 3. Update Status
            function updateStatus(orderId, newStatus) {
                fetch('/api/cook/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: orderId, status: newStatus })
                }).then(r => r.json()).then(d => {
                    if (d.success) {
                        showToast('success', 'Order status updated');
                        loadOrders();
                    } else showAlert('error', 'Error', "Error updating order.");
                });
            }

            // 4. Attendance
            function updateAttendance() {
                let remark = document.getElementById('attRemark').value;
                if (!remark) return showToast('warning', "Please enter a remark.");
                fetch('/api/attendance/update', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ remark })
                }).then(r => r.json()).then(d => {
                    if (d.status === 'success') showToast('success', "Shift Status Updated!");
                    else showAlert('error', 'Error', "Error updating attendance");
                });
            }

            loadOrders();
            try {
                const socket = io();
                socket.on('db_changed', () => loadOrders());
            } catch (e) { console.log('Socket.IO not available'); }
        </script>
</body>

</html>
